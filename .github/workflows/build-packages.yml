name: Build and Publish Packages

on:
  push:
    branches:
      - main

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          packages=()
          for dir in packages/*/; do
            [ -f "$dir/Dockerfile" ] || continue
            packages+=("\"$(basename "$dir")\"")
          done
          if [ ${#packages[@]} -eq 0 ]; then
            echo "No packages found; exiting."
            exit 0
          fi
          matrix=$(IFS=,; echo "[${packages[*]}]")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Detected packages: $matrix"

  build:
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect.outputs.matrix) }}
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: packages/${{ matrix.package }}/
          file: packages/${{ matrix.package }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: "ghcr.io/${{ github.repository }}/${{ matrix.package }}:latest-linux-${{ matrix.arch }}"
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.platform=linux/${{ matrix.arch }}

  publish-manifests:
    needs: [build, detect]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform manifests
        env:
          MATRIX: ${{ needs.detect.outputs.matrix }}
          REPO: ${{ github.repository }}
        run: |
          IFS=',' read -ra pkgs <<< "${MATRIX#\[}"
          pkgs=("${pkgs[@]//\]/}")
          for pkg in "${pkgs[@]}"; do
            pkg="${pkg//\"/}"
            echo "::notice::Publishing manifest for $pkg"
            docker buildx imagetools create \
              --tag "ghcr.io/$REPO/$pkg:latest" \
              "ghcr.io/$REPO/$pkg:latest-linux-amd64" \
              "ghcr.io/$REPO/$pkg:latest-linux-arm64"
          done
